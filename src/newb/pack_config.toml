# subpacks: High (default), then Medium (vibrant clouds), Low (ESTN clouds) last.
# High is the default/base quality.

[[subpack]]
define = "NO_REFLECTIONS"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Low
Ground, block & water reflections are turned off + ESTN-style soft clouds.
The lightest option.
'''

[[subpack]]
define = "MEDIUM"
materials = ["RenderChunk", "Clouds", "Sky"]
description = '''
Medium
Vibrant painted clouds. Cloud & aurora reflections on water are turned off
for better performance. Sun/Moon mirror and ground reflections stay on.
'''

[[subpack]]
define = "DEFAULT"
materials = []
description = '''
High
'''

